<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAY | رأي — صوتك مهم، ورأيك يصنع الفرق</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --text:#1a1d29; --muted:#6b7280;
  --primary:#4f46e5; --primary2:#7c3aed; --blue:#2563eb;
  --border:#e5e7eb; --shadow:0 4px 24px rgba(0,0,0,.08);
  --danger:#ef4444; --success:#10b981; --gold:#f59e0b;
}
[data-theme="dark"]{
  --bg:#0f1120; --card:#1a1d33; --text:#eef0fa; --muted:#9aa3b8;
  --border:#2a2f4a; --shadow:0 4px 24px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;font-family:inherit}
input,textarea,select{font-family:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;width:100%;font-size:15px;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
.btn{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(99,60,245,.3)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border);box-shadow:none}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:10px}
.btn-danger{background:linear-gradient(135deg,#ef4444,#f97316)}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600}
.tag-blue{background:linear-gradient(135deg,#2563eb,#06b6d4)}
.badge{background:rgba(99,60,245,.12);color:var(--primary);padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-lg{width:80px;height:80px;font-size:32px}
/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,#1e1b4b,#4f46e5,#7c3aed,#2563eb);background-size:300% 300%;animation:bgmove 6s ease infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
@keyframes bgmove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#splash .logo{font-size:70px;font-weight:900;color:#fff;animation:pop 1s ease, float 2.5s ease-in-out 1s infinite}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#splash .slogan{color:rgba(255,255,255,.9);font-size:18px;animation:fadein 1.4s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* ---------- Layout ---------- */
#app{display:none;min-height:100vh;padding-bottom:90px}
#app.on{display:block}
header.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.topbar .brand{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--primary2),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
nav.tabs a{padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
nav.tabs a.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
main{max-width:960px;margin:0 auto;padding:20px 14px}
.bottomnav{position:fixed;bottom:0;right:0;left:0;z-index:50;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 4px}
.bottomnav a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding:4px 10px;border-radius:10px}
.bottomnav a .ic{font-size:20px}
.bottomnav a.on{color:var(--primary);font-weight:800}
@media(min-width:900px){.bottomnav{display:none}#app{padding-bottom:20px}}
.notif-dot{position:absolute;top:2px;right:8px;background:var(--danger);color:#fff;border-radius:50%;font-size:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-weight:800}
/* ---------- Home ---------- */
.hero{background:linear-gradient(135deg,var(--primary),var(--primary2),var(--blue));border-radius:22px;color:#fff;padding:32px 26px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:"💬";position:absolute;left:-10px;bottom:-24px;font-size:120px;opacity:.15}
.hero h1{font-size:26px;margin-bottom:8px}
.search-row{display:flex;gap:10px;margin:16px 0 24px}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid-5{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.cat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;text-align:center;font-weight:700;transition:transform .15s,border .15s;cursor:pointer}
.cat-card:hover{transform:translateY(-3px);border-color:var(--primary)}
.cat-card .ci{font-size:26px;display:block;margin-bottom:8px}
.question{border-bottom:1px solid var(--border);padding:16px 0}
.question:last-child{border:none}
.q-title{font-weight:800;font-size:17px;margin-bottom:6px;cursor:pointer}
.q-title:hover{color:var(--primary)}
.vote-bar{display:flex;height:34px;border-radius:10px;overflow:hidden;font-size:12px;font-weight:700;margin:10px 0}
.vote-bar div{display:flex;align-items:center;justify-content:center;color:#fff;min-width:0;transition:width .4s ease}
.vb-yes{background:linear-gradient(90deg,#10b981,#059669)}
.vb-no{background:linear-gradient(90deg,#ef4444,#dc2626)}
.vb-mid{background:linear-gradient(90deg,#f59e0b,#d97706)}
.vote-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.vote-btns button{flex:1;min-width:90px;padding:8px;border-radius:10px;font-weight:700;font-size:13px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);transition:all .15s}
.vote-btns button.sel-yes{background:#10b981;border-color:#10b981;color:#fff}
.vote-btns button.sel-no{background:#ef4444;border-color:#ef4444;color:#fff}
.vote-btns button.sel-mid{background:#f59e0b;border-color:#f59e0b;color:#fff}
.q-img{max-width:100%;border-radius:12px;margin-top:10px;max-height:320px;object-fit:cover}
/* ---------- Chat ---------- */
.chat-box{display:flex;flex-direction:column;gap:10px;height:55vh;overflow-y:auto;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--bg)}
.msg{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.7;position:relative}
.msg .t{display:block;font-size:10px;opacity:.7;margin-top:4px}
.msg.me{align-self:flex-start;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-end;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-input{display:flex;gap:8px;margin-top:12px}
/* ---------- Leaderboard ---------- */
.lb-row{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;background:var(--card)}
.lb-rank{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;background:var(--bg);color:var(--muted)}
.lb-rank.r1{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff}
.lb-rank.r2{background:linear-gradient(135deg,#9ca3af,#e5e7eb);color:#fff}
.lb-rank.r3{background:linear-gradient(135deg,#b45309,#d97706);color:#fff}
.xpbar{height:8px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));border-radius:999px;transition:width .5s}
/* ---------- Admin / misc ---------- */
table.adm{width:100%;border-collapse:collapse;font-size:13px}
table.adm th,table.adm td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:right}
table.adm th{color:var(--muted);font-weight:700}
.stat{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:14px;padding:16px;text-align:center}
.stat b{font-size:24px;color:var(--primary)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.toast{position:fixed;bottom:96px;right:50%;transform:translateX(50%);background:#111827;color:#fff;padding:12px 22px;border-radius:12px;z-index:999;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:toastin .3s ease;max-width:90%}
@keyframes toastin{from{opacity:0;transform:translateX(50%) translateY(14px)}to{opacity:1}}
.star{color:var(--gold);cursor:pointer;font-size:22px}
.comment{border-bottom:1px solid var(--border);padding:12px 0}
.comment:last-child{border:none}
.comment.best{background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(5,150,105,.04));border-radius:12px;padding:12px;border:1px solid rgba(16,185,129,.3)!important}
.auth-wrap{max-width:420px;margin:40px auto}
.section-title{font-size:20px;font-weight:900;margin:26px 0 14px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--border),transparent)}
.hidden{display:none!important}
.admin-only{display:none}
body.is-admin .admin-only{display:inline-flex}
.sort-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sort-row button{padding:7px 14px;border-radius:10px;background:var(--card);border:1.5px solid var(--border);color:var(--muted);font-weight:700;font-size:13px}
.sort-row button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.rep-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.switch{position:relative;width:48px;height:26px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:.2s;cursor:pointer}
.switch i::after{content:"";position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;right:3px;transition:.2s}
.switch input:checked+i{background:var(--primary)}
.switch input:checked+i::after{transform:translateX(-22px)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="splash">
  <div class="logo">RAY</div>
  <div style="color:#fff;font-size:34px;font-weight:900;letter-spacing:2px">رأي</div>
  <div class="slogan">صوتك مهم، ورأيك يصنع الفرق 💜</div>
</div>

<div id="app"></div>
<div id="modal-root"></div>

<script>
/* ============================================================
   RAY | رأي — تطبيق اجتماعي عربي متكامل (نسخة واجهة + قاعدة بيانات محلية)
   قاعدة البيانات: LocalStorage (تعمل فوراً بدون خادم)
   للنشر الحقيقي: اربط Firebase/Supabase — انظر دليل النشر أسفل الصفحة
   ============================================================ */

const LS = { get:(k,d)=>{try{const v=localStorage.getItem('ray_'+k);return v?JSON.parse(v):d}catch(e){return d}}, set:(k,v)=>localStorage.setItem('ray_'+k,JSON.stringify(v)) };
const esc = s => (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const now = () => new Date().toISOString();
const ago = iso => { const s=(Date.now()-new Date(iso))/1000; if(s<60)return'الآن'; if(s<3600)return Math.floor(s/60)+' د'; if(s<86400)return Math.floor(s/3600)+' س'; if(s<604800)return Math.floor(s/86400)+' يوم'; return new Date(iso).toLocaleDateString('ar'); };
const hash = s => { let h=0; for(let i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0} return 'h'+(h>>>0).toString(36)+s.length };

/* ---------- التصنيفات ---------- */
const CATS = [
 {id:'din',n:'ديني',i:'🕌'},{id:'ilm',n:'علمي',i:'🔬'},{id:'tha',n:'ثقافي',i:'📚'},
 {id:'ijt',n:'اجتماعي',i:'🤝'},{id:'ala',n:'العلاقات',i:'💞'},{id:'tal',n:'تعليمي',i:'🎓'},
 {id:'iqt',n:'اقتصادي',i:'💰'},{id:'siy',n:'سياسي',i:'🏛️'},{id:'taq',n:'تقني',i:'💻'},{id:'am',n:'عام',i:'🌐'}
];
const catOf = id => CATS.find(c=>c.id===id)||CATS[9];
const SPEC = ['مستشار ديني','مستشار نفسي','مستشار أسري','مستشار تعليمي','مستشار مهني','مستشار مالي','مستشار علمي','مستشار قانوني','مستشار تقني','مستشار اجتماعي'];

/* ---------- المستويات ---------- */
const LEVELS = ['مبتدئ','مشارك','نشيط','متميز','خبير','مؤثر','أسطورة رأي'];
const levelOf = xp => { const t=[0,50,150,350,700,1200,2000]; let l=0; t.forEach((x,i)=>{if(xp>=x)l=i}); return {name:LEVELS[l],next:t[l+1]||null,cur:t[l]}; };

/* ---------- XP ---------- */
function addXP(userId, pts, reason){
  if(!userId) return;
  let x = LS.get('xp',{}); x[userId]=(x[userId]||0)+pts; LS.set('xp',x);
  if(userId===me()?.id) notify(userId,'نقاط خبرة',`+${pts} نقطة: ${reason}`, '#/leaderboard');
  saveLeaderHistory(userId, pts);
}
function xpOf(id){ return LS.get('xp',{})[id]||0; }
function saveLeaderHistory(id,pts){
  let h = LS.get('lb',{}); const wk=new Date().toISOString().slice(0,10), mo=wk.slice(0,7);
  h[id]=h[id]||{}; h[id]['w'+wk]=(h[id]['w'+wk]||0)+pts; h[id]['m'+mo]=(h[id]['m'+mo]||0)+pts; LS.set('lb',h);
}
const currentWeek = ()=>'w'+new Date().toISOString().slice(0,10);
const currentMonth = ()=>'m'+new Date().toISOString().slice(0,7);

/* ---------- قاعدة البيانات المحلية ---------- */
const DB = {
  users:   ()=>LS.get('users',[]),
  saveUsers:u=>LS.set('users',u),
  questions:()=>LS.get('questions',[]),
  saveQuestions:q=>LS.set('questions',q),
  votes:   ()=>LS.get('votes',{}),
  saveVotes:v=>LS.set('votes',v),
  comments:()=>LS.get('comments',[]),
  saveComments:c=>LS.set('comments',c),
  consults:()=>LS.get('consults',[]),
  saveConsults:c=>LS.set('consults',c),
  advisors:()=>LS.get('advisors',[]),
  saveAdvisors:a=>LS.set('advisors',a),
  chats:   ()=>LS.get('chats',[]),
  saveChats:c=>LS.set('chats',c),
  notifs:  ()=>LS.get('notifs',[]),
  saveNotifs:n=>LS.set('notifs',n),
  ratings: ()=>LS.get('ratings',{}),
  saveRatings:r=>LS.set('ratings',r),
  reports: ()=>LS.get('reports',[]),
  saveReports:r=>LS.set('reports',r),
  flags:   ()=>LS.get('flags',{}),
  saveFlags:f=>LS.set('flags',f)
};

function notify(userId, title, body, link){
  if(!userId) return;
  const n = DB.notifs(); n.unshift({id:uid(),userId,title,body,link:link||'#/',read:false,at:now()});
  DB.saveNotifs(n.slice(0,200));
}

/* ---------- الجلسة ---------- */
function me(){ const id=LS.get('session',null); if(!id)return null; return DB.users().find(u=>u.id===id)||null; }
function setSession(id){ LS.set('session',id); refreshAuthUI(); }
function logout(){ LS.set('session',null); location.hash='#/'; render(); }
function isAdmin(){ return me()?.role==='admin'; }

/* ---------- بيانات أولية ---------- */
function seed(){
  if(LS.get('seeded',false)) return;
  const admins=[{id:'admin1',name:'إدارة رأي',email:'admin@ray.app',pass:hash('rayadmin123'),bio:'حساب إدارة التطبيق',role:'admin',avatar:'',verified:true,blocked:false,guest:false,created:now(),notify:true}];
  let us=[{id:'u1',name:'أحمد الخطيب',email:'ahmad@example.com',pass:hash('123456'),bio:'مهتم بالعلوم والتقنية',role:'user',avatar:'',verified:false,blocked:false,guest:false,created:now(),notify:true},
    {id:'u2',name:'سارة الحمصي',email:'sara@example.com',pass:hash('123456'),bio:'أحب القراءة والنقاش الهادئ',role:'user',avatar:'',verified:false,blocked:false,guest:false,created:now(),notify:true},
    {id:'u3',name:'خالد العبدالله',email:'khaled@example.com',pass:hash('123456'),bio:'طالب جامعي - علم نفس',role:'user',avatar:'',verified:false,blocked:false,guest:false,created:now(),notify:true}];
  DB.saveUsers(admins.concat(us));
  const qs=[
   {id:'q1',userId:'u1',title:'هل تؤيدون تعليم البرمجة من المرحلة الابتدائية؟',body:'وجهة نظري: نعم، لأن تفكير الحاسوب ينمي المنطق والإبداع مبكراً.',cat:'tal',image:'',anonymous:false,views:0,created:now(),edited:false},
   {id:'q2',userId:'u2',title:'هل تشعرون أن وسائل التواصل ضعفت العلاقات الحقيقية؟',body:'',cat:'ijt',image:'',anonymous:true,views:0,created:now(),edited:false},
   {id:'q3',userId:'u3',title:'هل الاستثمار في الذهب أفضل من الاستثمار في العملات الرقمية؟',body:'أرى أن الذهب أكثر أماناً، وأنتم؟',cat:'iqt',image:'',anonymous:false,views:0,created:now(),edited:false},
   {id:'q4',userId:'u1',title:'هل يجب على الحكومات فرض ضرائب على شركات التكنولوجيا العملاقة؟',body:'',cat:'siy',image:'',anonymous:false,views:0,created:now(),edited:false},
   {id:'q5',userId:'u2',title:'ما رأيكم في التعليم عن بعد؟ هل حقق نفس جودة الحضوري؟',body:'',cat:'tal',image:'',anonymous:true,views:0,created:now(),edited:false},
   {id:'q6',userId:'u3',title:'هل الذكاء الاصطناعي سيحل محل المبرمجين خلال عشر سنوات؟',body:'',cat:'taq',image:'',anonymous:false,views:0,created:now(),edited:false},
   {id:'q7',userId:'u1',title:'هل القراءة الورقية أفضل من القراءة الإلكترونية؟',body:'',cat:'tha',image:'',anonymous:false,views:0,created:now(),edited:false},
   {id:'q8',userId:'u2',title:'هل التسامح في العلاقات أهم من إثبات الحق؟',body:'وجهة نظري: التسامح يحفظ العلاقات لكن بحدود.',cat:'ala',image:'',anonymous:false,views:0,created:now(),edited:false},
   {id:'q9',userId:'u3',title:'هل تؤيدون تخصيص جزء من الزكاة لدعم البحث العلمي؟',body:'',cat:'din',image:'',anonymous:false,views:0,created:now(),edited:false},
   {id:'q10',userId:'u1',title:'هل من العدل أن يُحسم القطاع العام بمرتبات أعلى من الخاص؟',body:'',cat:'iqt',image:'',anonymous:false,views:0,created:now(),edited:false}
  ];
  DB.saveQuestions(qs);
  let v={};
  v['q1']={u1:'yes',u2:'yes',u3:'mid'}; v['q2']={u1:'yes',u3:'no'}; v['q3']={u1:'mid',u2:'yes'}; v['q6']={u1:'yes',u2:'no',u3:'yes'};
  DB.saveVotes(v);

/* ---------- توست ---------- */
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ---------- مودال ---------- */
function openModal(html){ document.getElementById('modal-root').innerHTML = `<div style="position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)closeModal()"><div class="card" style="max-width:480px;width:100%;max-height:86vh;overflow-y:auto">${html}</div></div>`; }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ---------- الموجّه ---------- */
function route(){
  let h = location.hash || '#/';
  // توافق مع الروابط القديمة التي كانت تُنشأ بدون الشرطة بعد #
  if(h.startsWith('#q/')) h = '#/q/' + h.slice(3);
  if(h.startsWith('#advisor/')) h = '#/advisor/' + h.slice(9);
  if(h.startsWith('#chat/')) h = '#/chat/' + h.slice(6);
  if(h.startsWith('#cat/')) h = '#/cat/' + h.slice(5);
  const app = document.getElementById('app');
  app.classList.add('on');
  refreshAuthUI();
  if(h.startsWith('#/q/')) return renderQuestion(decodeURIComponent(h.slice(4)));
  if(h.startsWith('#/cat/')) return renderCategory(decodeURIComponent(h.slice(6)));
  if(h.startsWith('#/advisor/')) return renderAdvisor(decodeURIComponent(h.slice(10)));
  if(h.startsWith('#/chat/')) return renderChat(decodeURIComponent(h.slice(7)));
  if(h.startsWith('#/editq/')) return renderAddQuestion(decodeURIComponent(h.slice(8)));
  const map = {'#/':'renderHome','#/login':'renderLogin','#/register':'renderRegister','#/add':'renderAddQuestion','#/consult':'renderConsults','#/advisors':'renderAdvisors','#/chats':'renderChats','#/notifs':'renderNotifs','#/profile':'renderProfile','#/leaderboard':'renderLeaderboard','#/settings':'renderSettings','#/support':'renderSupport','#/admin':'renderAdmin','#/cats':'renderCats'};
  (window[map[h]]||renderHome)();
}
window.addEventListener('hashchange',route);

/* ---------- عناصر مشتركة ---------- */
function userOf(id){ return DB.users().find(u=>u.id===id); }
function qAuthor(q){ if(q.anonymous) return {name:'مستخدم مجهول',avatar:'🕵️'}; const u=userOf(q.userId); return u?{name:u.name,avatar:u.avatar}:{name:'مستخدم محذوف',avatar:''}; }
function voteStats(qid){
  const v = DB.votes()[qid]||{}; const vals=Object.values(v);
  const c={yes:0,no:0,mid:0}; vals.forEach(x=>c[x]!==undefined&&c[x]++);
  const total=vals.length;
  const p = total?{yes:Math.round(c.yes/total*100),no:Math.round(c.no/total*100),mid:100-Math.round(c.yes/total*100)-Math.round(c.no/total*100)}:{yes:0,no:0,mid:0};
  return {c,p,total};
}
function voteBarHTML(qid){
  const {p,total}=voteStats(qid);
  if(!total) return `<div class="muted" style="margin:8px 0">لا أصوات بعد — كن أول المشاركين 🗳️</div>`;
  return `<div class="muted" style="margin:10px 0 4px">${total} صوت</div>
  <div class="vote-bar">
    <div class="vb-yes" style="width:${p.yes||0}%">أوافق ${p.yes||0}%</div>
    <div class="vb-mid" style="width:${p.mid||0}%">محايد ${p.mid||0}%</div>
    <div class="vb-no" style="width:${p.no||0}%">لا أوافق ${p.no||0}%</div>
  </div>`;
}
function voteButtonsHTML(qid){
  const u=me(); const my=DB.votes()[qid]?.[u?.id];
  const need=()=>toast('سجّل دخولك أو ادخل كضيف أولاً');
  return `<div class="vote-btns">
    <button class="${my==='yes'?'sel-yes':''}" onclick="doVote('${qid}','yes')">👍 أوافق</button>
    <button class="${my==='mid'?'sel-mid':''}" onclick="doVote('${qid}','mid')">😐 محايد</button>
    <button class="${my==='no'?'sel-no':''}" onclick="doVote('${qid}','no')">👎 لا أوافق</button>
  </div>`;
}
window.doVote = async function(qid,val){
  const u=me(); if(!u){location.hash='#/login';return;}
  const map={yes:'agree',no:'disagree',mid:'neutral'}; const old=DB.votes()[qid]?.[u.id];
  let result;
  if(old===val) result=await raySupabase.from('votes').delete().eq('question_id',Number(qid)).eq('user_id',u.id);
  else result=await raySupabase.from('votes').upsert({question_id:Number(qid),user_id:u.id,vote:map[val]},{onConflict:'question_id,user_id'});
  if(result.error){toast('تعذر حفظ التصويت: '+result.error.message);return;}
  await raySyncSocial(); toast(old===val?'تم سحب صوتك':'تم تسجيل صوتك ✓'); route();
};
function questionCardHTML(q, compact){
  const a=qAuthor(q); const cat=catOf(q.cat);
  const cmts=DB.comments().filter(c=>c.qid===q.id);
  const u=me();
  return `<div class="question">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">
      <span class="avatar" style="width:34px;height:34px;font-size:15px">${a.avatar?`<img src="${a.avatar}">`:a.avatar==='🕵️'?'🕵️':esc(a.name[0])}</span>
      <div><div style="font-weight:700;font-size:14px">${esc(a.name)}</div><div class="muted">${ago(q.created)} · ${cat.i} ${cat.n}</div></div>
      ${u&&(u.id===q.userId)?`<span style="margin-right:auto;display:flex;gap:6px">
        <a class="btn btn-ghost btn-sm" href="#/editq/${q.id}">✏️</a>
        <button class="btn btn-danger btn-sm" onclick="delQuestion('${q.id}')">🗑️</button></span>`:''}
    </div>
    <div class="q-title" onclick="location.hash='#/q/${q.id}'">${esc(q.title)}</div>
    ${q.body?`<div class="muted" style="line-height:1.8">${esc(q.body).slice(0,compact?120:400)}</div>`:''}
    ${q.image?`<img class="q-img" src="${q.image}" onclick="location.hash='#/q/${q.id}'">`:''}
    ${voteBarHTML(q.id)}
    ${voteButtonsHTML(q.id)}
    <div class="muted" style="margin-top:10px;display:flex;gap:16px;align-items:center">
      <a href="#/q/${q.id}" style="font-weight:700;color:var(--primary)">💬 ${cmts.length} تعليق</a>
      <span>👁️ ${q.views||0}</span>
      <span style="margin-right:auto"></span>
      <button class="btn btn-ghost btn-sm" onclick="reportContent('سؤال','${q.id}')">🚩 بلاغ</button>
    </div>
  </div>`;
}
window.delQuestion=function(id){ if(!confirm('حذف السؤال نهائياً؟'))return; DB.saveQuestions(DB.questions().filter(q=>q.id!==id)); DB.saveComments(DB.comments().filter(c=>c.qid!==id)); toast('تم الحذف'); route(); };

window.reportContent = function(type,id){
  let u=me(); if(!u){ return location.hash='#/login'; }

 const {data:qs,error:qe}=await raySupabase.from('questions').select('*').order('created_at',{ascending:false}); if(qe) throw qe;

 const voteMap={}; (vs||[]).forEach(x=>{(voteMap[String(x.question_id)] ||= {})[x.user_id]=({agree:'yes',disagree:'no',neutral:'mid'})[x.vote]||x.vote});

async function rayLoadProfile(authUser, fallbackName){

    if(result.error) throw result.error; data=result.data;
  }
  return rayLocalUser(data,authUser);
}

window.submitConsult=function(e){
  e.preventDefault(); const u=me();
  const cs=DB.consults();
  const last=cs.filter(c=>c.userId===u.id).pop();
  if(last && (Date.now()-new Date(last.created))<60000){ toast('انتظر دقيقة بين كل استشارة ⏳'); return false; }
  cs.unshift({id:uid(),userId:u.id,title:document.getElementById('ctitle').value.trim(),body:document.getElementById('cbody').value.trim(),cat:document.getElementById('ccat').value,anonymous:document.getElementById('canon').checked,created:now(),advisorId:null,status:'open',answers:[]});
  DB.saveConsults(cs); addXP(u.id,15,'نشر استشارة'); closeModal(); toast('نُشرت استشارتك ✓ (+15 نقطة)'); route(); return false;
};
window.answerConsult=function(e,cid){
  e.preventDefault(); const u=me();
  const text=e.target.querySelector('[name=ans]').value.trim(); if(!text)return false;
  const cs=DB.consults(); const c=cs.find(x=>x.id===cid);
  // إجابة مفيدة = أكثر من 80 حرفاً → +10، قصيرة → +3 نقاش
  const useful=text.length>=80;
  c.answers.push({id:uid(),by:u.id,text,likes:0,at:now()}); DB.saveConsults(cs);
  addXP(u.id,useful?10:3,useful?'إجابة مفيدة':'مشاركة في نقاش');
  if(c.userId!==u.id) notify(c.userId,'نصيحة جديدة',`${u.name} أضاف نصيحة لاستشارتك`,'#/consult');
  toast(useful?'نصيحتك مفيدة ✓ (+10 نقاط)':'شكراً لمشاركتك ✓ (+3 نقاط)'); route(); return false;
};
window.likeAnswer=function(cid,aid){
  let u=me(); if(!u){ location.hash='#/login'; return; }
  const key=u.id+'_a_'+aid;
  if(DB.flags()[key]){ toast('أعجبت بهذه النصيحة مسبقاً'); return; }
  const cs=DB.consults(); const an=cs.find(c=>c.id===cid).answers.find(a=>a.id===aid);
  an.likes++; DB.saveConsults(cs);
  let f=DB.flags(); f[key]=1; DB.saveFlags(f);
  addXP(an.by,2,'إعجاب بنصيحتك'); route();
};

  const f=inp.files[0]; if(!f)return;
  if(f.size>500*1024){ toast('الصورة كبيرة'); return; }
  const r=new FileReader(); r.onload=e=>{ const us=DB.users(); const u=us.find(x=>x.id===me().id); u.avatar=e.target.result; DB.saveUsers(us); toast('تم تحديث صورتك ✓'); route(); }; r.readAsDataURL(f);
};
window.editProfile=function(){
  const u=me();
  openModal(`<h3 style="margin-bottom:12px">✏️ تعديل الحساب</h3>
  <form onsubmit="return saveProfile(event)" style="display:flex;flex-direction:column;gap:10px">
    <input id="pname" value="${esc(u.name)}" required maxlength="40">
    <textarea id="pbio" rows="3" placeholder="نبذة تعريفية...">${esc(u.bio)}</textarea>
    <input id="ppass" type="password" placeholder="كلمة مرور جديدة (اتركها فارغة للإبقاء)">
    <button class="btn">حفظ</button>
  </form>`);
};
window.saveProfile=function(e){
  e.preventDefault(); const us=DB.users(); const u=us.find(x=>x.id===me().id);
  u.name=document.getElementById('pname').value.trim();
  u.bio=document.getElementById('pbio').value.trim();
  const p=document.getElementById('ppass').value;
  if(p){ if(p.length<6){ toast('كلمة المرور قصيرة'); return false; } u.pass=hash(p); }
  DB.saveUsers(us); closeModal(); toast('تم الحفظ ✓'); route(); return false;
};

/* ---------- المتصدرون ---------- */
function renderLeaderboard(){
  const mode=LS.get('lbmode','all');
  let entries=[];
  if(mode==='all'){ entries=Object.entries(LS.get('xp',{})); }
  else { const key=mode==='week'?currentWeek():currentMonth(); entries=Object.entries(LS.get('lb',{})).map(([id,h])=>[id,h[key]||0]).filter(x=>x[1]>0); }
  entries.sort((a,b)=>b[1]-a[1]);
  layout('#/leaderboard',`<h2 style="margin-bottom:16px">👑 لوحة المتصدرين</h2>
  <div class="sort-row">
    <button class="${mode==='all'?'on':''}" onclick="LS.set('lbmode','all');route()">الكل ⭐</button>
    <button class="${mode==='week'?'on':''}" onclick="LS.set('lbmode','week');route()">أسبوعي 📅</button>
    <button class="${mode==='month'?'on':''}" onclick="LS.set('lbmode','month');route()">شهري 🗓️</button>
  </div>
  ${entries.length? entries.slice(0,20).map(([id,x],i)=>{
    const u=userOf(id); const lv=levelOf(x);
    return `<div class="lb-row"><span class="lb-rank ${i<3?'r'+(i+1):''}">${i+1}</span>
      <span class="avatar">${u&&u.avatar?`<img src="${u.avatar}">`:u?esc(u.name[0]):'👤'}</span>
      <div style="flex:1"><b>${u?esc(u.name):'مستخدم'}</b><div class="muted">${lv.name}</div></div>
      <b style="color:var(--primary)">${x} XP</b></div>`}).join('')
  :'<div class="card" style="text-align:center;padding:30px"><p class="muted">لا نقاط مسجلة في هذه الفترة بعد — كن الأول! 🔥</p></div>'}
  <div class="card" style="margin-top:16px"><h3 style="margin-bottom:10px">🎖️ نظام المستويات</h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${LEVELS.map((l,i)=>`<span class="badge">${'🥉🥈🥇🎖️💎👑🔥'[i]} ${l}</span>`).join('')}</div></div>`);
}

/* ---------- الإعدادات ---------- */
function renderSettings(){
  const u=me();
  layout('#/settings',`<div style="max-width:560px;margin:0 auto"><h2 style="margin-bottom:16px">⚙️ الإعدادات</h2>
  <div class="card" style="display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;justify-content:space-between;align-items:center"><div><b>الوضع الداكن</b><div class="muted">تفعيل المظهر الليلي</div></div>
      <label class="switch"><input type="checkbox" ${document.documentElement.dataset.theme==='dark'?'checked':''} onchange="toggleTheme()"><i></i></label></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><div><b>الإشعارات</b><div class="muted">تنبيهات التعليقات والرسائل</div></div>
      <label class="switch"><input type="checkbox" ${u&&u.notify?'checked':''} onchange="toggleNotify(this)"><i></i></label></div>
    <hr style="border:none;border-top:1px solid var(--border)">
    <div><b>🔒 الخصوصية</b><p class="muted" style="margin-top:6px;line-height:1.8">بياناتك محفوظة محلياً على جهازك في هذه النسخة. في النسخة المتصلة بالخادم تُطبق قواعد حماية صارمة تمنع أي وصول غير مصرح به لمحادثاتك وبياناتك، ومفاتيح الخدمات السرية تبقى على الخادم وليس في كود الواجهة.</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn btn-ghost" href="#/support">🛟 الدعم والإبلاغ</a>
      <button class="btn btn-danger" onclick="if(confirm('سيتم مسح جميع بيانات التطبيق من جهازك. متابعة؟')){localStorage.clear();location.reload()}">🗑️ مسح بياناتي</button>
    </div>
  </div>
  <div class="card" style="margin-top:16px"><b>📘 دليل النشر الحقيقي</b>
    <p class="muted" style="margin-top:8px;line-height:2">هذه النسخة تعمل فوراً بدون خادم (قاعدة بيانات محلية). للنشر العام متعدد المستخدمين والمحادثات الحقيقية، اربط التطبيق بـ <b>Supabase</b> (مجاني) أو <b>Firebase</b>:<br>
    1) أنشئ مشروعاً مجانياً.<br>
    2) انسخ مفاتيح العميل (آمنة للنشر) وضعها في ملف إعدادات — أما مفاتيح الخدمة السرية فتبقى في Server/Cloud Functions فقط.<br>
    3) طبّق الجداول: users, questions, categories, votes, comments, consultations, advisors, messages, notifications, xp, ratings, reports.<br>
    4) فعّل RLS (قواعد أمان الصفوف) بحيث لا يقرأ أحد رسائل غيره.<br>
    5) استبدل دوال DB.* في هذا الملف بنداءات الـ API.</p>
  </div></div>`);
}
window.toggleNotify=function(cb){ const us=DB.users(); const u=us.find(x=>x.id===me().id); u.notify=cb.checked; DB.saveUsers(us); toast(cb.checked?'الإشعارات مفعّلة':'الإشعارات متوقفة'); };

/* ---------- الدعم ---------- */
function renderSupport(){
  layout('#/support',`<div style="max-width:560px;margin:0 auto"><h2 style="margin-bottom:16px">🛟 الإبلاغ والدعم</h2>
  <div class="card">
    <h3 style="margin-bottom:10px">إرسال بلاغ أو استفسار</h3>
    <form onsubmit="return submitSupport(event)" style="display:flex;flex-direction:column;gap:10px">
      <select id="stype"><option>بلاغ عن محتوى</option><option>مشكلة تقنية</option><option>طلب استرجاع حساب</option><option>اقتراح</option><option>أخرى</option></select>
      <textarea id="sbody" rows="4" placeholder="اكتب التفاصيل..." required></textarea>
      <button class="btn">إرسال</button>
    </form>
  </div></div>`);
}
window.submitSupport=function(e){
  e.preventDefault();
  const r=DB.reports(); r.unshift({id:uid(),by:me()?.id||'guest',type:'support',refId:'',reason:document.getElementById('stype').value+': '+document.getElementById('sbody').value.trim(),status:'open',at:now()});
  DB.saveReports(r); toast('وصلتنا رسالتك — سنرد قريباً ✓'); location.hash='#/'; return false;
};

/* ---------- لوحة الإدارة ---------- */
function renderAdmin(){
  if(!isAdmin()){ layout('#/', '<div class="card" style="text-align:center;padding:40px"><h3>⛔ صلاحيات الإدارة فقط</h3><p class="muted" style="margin-top:8px">جرّب: admin@ray.app / rayadmin123</p></div>'); return; }
  const us=DB.users(), qs=DB.questions(), cs=DB.comments(), rp=DB.reports(), ad=DB.advisors();
  const tab = LS.get('admintab','stats');
  let body='';
  if(tab==='stats'){
    body=`<h3 style="margin:18px 0 12px">📊 إحصائيات التطبيق</h3><div class="stat-grid">
      <div class="stat"><b>${us.length}</b><span class="muted">مستخدم</span></div>
      <div class="stat"><b>${qs.length}</b><span class="muted">سؤال</span></div>
      <div class="stat"><b>${cs.length}</b><span class="muted">تعليق</span></div>
      <div class="stat"><b>${DB.consults().length}</b><span class="muted">استشارة</span></div>
      <div class="stat"><b>${DB.chats().length}</b><span class="muted">محادثة</span></div>
      <div class="stat"><b>${rp.filter(r=>r.status==='open').length}</b><span class="muted">بلاغ مفتوح</span></div>
    </div>`;
  } else if(tab==='users'){
    body=`<h3 style="margin:18px 0 12px">👥 إدارة المستخدمين</h3>
    <table class="adm"><tr><th>الاسم</th><th>البريد</th><th>الحالة</th><th></th></tr>
    ${us.map(u=>`<tr><td>${esc(u.name)} ${u.role==='admin'?'<span class="badge">admin</span>':''}</td><td class="muted">${esc(u.email||'—')}</td>
    <td>${u.blocked?'<span style="color:var(--danger)">محظور</span>':'نشط'}</td>
    <td>${u.role!=='admin'?`<button class="btn ${u.blocked?'btn-ghost':'btn-danger'} btn-sm" onclick="adminToggleBlock('${u.id}')">${u.blocked?'فك الحظر':'حظر'}</button>`:''}</td></tr>`).join('')}</table>`;
  } else if(tab==='content'){
    body=`<h3 style="margin:18px 0 12px">📝 إدارة الأسئلة والتعليقات</h3>
    ${qs.map(q=>`<div class="rep-card" style="display:flex;gap:10px;align-items:center"><div style="flex:1"><b>${esc(q.title)}</b><div class="muted">${catOf(q.cat).n} · ${ago(q.created)}</div></div>
    <a class="btn btn-ghost btn-sm" href="#/q/${q.id}">عرض</a><button class="btn btn-danger btn-sm" onclick="delQuestion('${q.id}')">🗑️</button></div>`).join('')}
    <h3 style="margin:18px 0 12px">التعليقات الأخيرة</h3>
    ${cs.slice(0,20).map(c=>`<div class="rep-card" style="display:flex;gap:10px;align-items:center"><div style="flex:1" class="muted">${esc(c.text.slice(0,80))}</div>
    <button class="btn btn-danger btn-sm" onclick="delComment('${c.id}')">🗑️</button></div>`).join('')}`;
  } else if(tab==='cats'){
    body=`<h3 style="margin:18px 0 12px">🗂️ إدارة التصنيفات</h3>
    <table class="adm"><tr><th>التصنيف</th><th>الأسئلة</th></tr>
    ${CATS.map(c=>`<tr><td>${c.i} ${c.n}</td><td>${qs.filter(q=>q.cat===c.id).length}</td></tr>`).join('')}</table>
    <p class="muted" style="margin-top:10px">التصنيفات الثابتة مضمّنة في الكود — يمكن نقلها للجداول عند الربط بالخادم.</p>`;
  } else if(tab==='advisors'){
    const apps=rp.filter(r=>r.type==='advisor_apply');
    body=`<h3 style="margin:18px 0 12px">🎓 طلبات المستشارين (${apps.filter(a=>a.status==='open').length})</h3>
    ${apps.map(ap=>`<div class="rep-card"><b>${SPEC[+ap.refId]||''}</b><p class="muted" style="margin:6px 0">${esc(ap.reason)}</p>
    <div style="display:flex;gap:8px;margin-top:8px">
    ${ap.status==='open'?`<button class="btn btn-sm" onclick="adminApproveAdv('${ap.id}')">✅ قبول وتوثيق</button><button class="btn btn-danger btn-sm" onclick="adminCloseRep('${ap.id}')">❌ رفض</button>`:`<span class="badge">${ap.status==='approved'?'موثّق':'مرفوض'}</span>`}
    </div></div>`).join('')||'<p class="muted">لا طلبات.</p>'}
    <h3 style="margin:18px 0 12px">المستشارون الحاليون</h3>
    ${ad.map(a=>`<div class="rep-card" style="display:flex;align-items:center;gap:10px"><span class="avatar" style="width:34px;height:34px">${a.avatar}</span>
    <div style="flex:1"><b>${esc(a.name)}</b> ${a.verified?'✅':''}<div class="muted">${SPEC[a.spec]}</div></div>
    ${a.verified?`<button class="btn btn-danger btn-sm" onclick="adminUnverifyAdv('${a.id}')">سحب التوثيق</button>`:`<button class="btn btn-sm" onclick="adminVerifyAdv('${a.id}')">توثيق</button>`}</div>`).join('')}`;
  } else if(tab==='reports'){
    body=`<h3 style="margin:18px 0 12px">🚩 مراجعة البلاغات</h3>
    ${rp.filter(r=>r.type!=='advisor_apply').map(r=>`<div class="rep-card"><b>${r.type}</b> <span class="badge">${r.status==='open'?'مفتوح':'مغلق'}</span>
    <p class="muted" style="margin:6px 0">${esc(r.reason)}</p><div class="muted">${ago(r.at)}</div>
    <div style="display:flex;gap:8px;margin-top:8px">
    ${r.status==='open'?`<button class="btn btn-sm" onclick="adminCloseRep('${r.id}')">✔️ معالجة</button>
    <button class="btn btn-danger btn-sm" onclick="adminDeleteContent('${r.type}','${r.refId}','${r.id}')">🗑️ حذف المحتوى المخالف</button>`:''}
    </div></div>`).join('')||'<p class="muted">لا بلاغات.</p>'}`;
  }
  layout('#/admin',`<h2>🛡️ لوحة الإدارة</h2>
  <div class="sort-row" style="margin-top:14px">
    ${[['stats','📊 إحصائيات'],['users','👥 المستخدمون'],['content','📝 المحتوى'],['cats','🗂️ التصنيفات'],['advisors','🎓 المستشارون'],['reports','🚩 البلاغات']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="LS.set('admintab','${t[0]}');route()">${t[1]}</button>`).join('')}
  </div><div class="card">${body}</div>`);
}
window.adminToggleBlock=function(id){ const us=DB.users(); const u=us.find(x=>x.id===id); u.blocked=!u.blocked; DB.saveUsers(us); toast(u.blocked?'تم حظر الحساب':'تم فك الحظر'); route(); };
window.adminCloseRep=function(id){ const r=DB.reports(); const x=r.find(y=>y.id===id); x.status='closed'; DB.saveReports(r); toast('تمت المعالجة'); route(); };
window.adminDeleteContent=function(type,refId,repId){
  if(type==='سؤال') DB.saveQuestions(DB.questions().filter(q=>q.id!==refId));
  if(type==='تعليق') DB.saveComments(DB.comments().filter(c=>c.id!==refId));
  adminCloseRep(repId);
};
window.adminVerifyAdv=function(id){ const a=DB.advisors(); a.find(x=>x.id===id).verified=true; DB.saveAdvisors(a); toast('تم التوثيق ✓'); route(); };
window.adminUnverifyAdv=function(id){ const a=DB.advisors(); a.find(x=>x.id===id).verified=false; DB.saveAdvisors(a); toast('تم سحب التوثيق'); route(); };
window.adminApproveAdv=function(repId){
  const r=DB.reports(); const ap=r.find(x=>x.id===repId); ap.status='approved'; DB.saveReports(r);
  notify(ap.by,'🎉 تهانينا','تم قبول طلبك — أنت الآن مستشار موثّق في رأي!','#/profile');
  toast('تم قبول المستشار وإشعاره ✓'); route();
};

/* ---------- إقلاع ---------- */
setTimeout(()=>{ document.getElementById('splash').style.display='none'; route(); },1800);
</script>
</body>
</html>
